services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: seguro_sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=SuaSenhaForte@2026
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql

  rabbitmq:
    image: rabbitmq:3-management
    container_name: seguro_rabbitmq
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Management Dashboard (admin / admin)
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin

  redis:
    image: redis:alpine
    container_name: seguro_redis
    ports:
      - "6379:6379"

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    container_name: seguro_otel_dashboard
    ports:
      - "18888:18888"   # Painel Visual OpenTelemetry
      - "4317:18889"    # Porta OTLP gRPC

volumes:
  sqlserver_data: